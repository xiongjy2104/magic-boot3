   # 配置ElasticSearch
#  elasticsearch:
#    rest:
#      uris: http://127.0.0.1:9200
#      username: elastic
#      password: 123456789


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost/magic-boot?useSSL=false&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF8&autoReconnect=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
#    url: jdbc:arrow-flight-sql://localhost/magic-boot?useSSL=false&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF8&autoReconnect=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
#    url: jdbc:arrow-flight-sql://{FE_HOST}:{fe.conf:arrow_flight_sql_port}?useServerPrepStmts=false&cachePrepStmts=true&useSSL=false&useEncryption=false";
    username: root
    password: root
    druid:
      # 下面为连接池的补充设置，应用到上面所有数据源中
      # 初始化大小，最小，最大
      initial-size: 5
      min-idle: 5
      max-active: 1000
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      pool-prepared-statements: true
      #   配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      use-global-data-source-stat: true
      # 配置监控服务器
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456
        reset-enable: false
        url-pattern: /druid/*
        # 添加IP白名单
        allow: ""
        # 添加IP黑名单，当白名单和黑名单重复时，黑名单优先级更高
        #deny:
      web-stat-filter:
        # 添加过滤规则
        url-pattern: /*
        # 忽略过滤格式
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
# 上传路径
upload:
  dir: D:/upload/



# 框架配置
magic-api:
  web: /web
  prefix: /api # 接口前缀，可以不配置，这里配置成 /api, 方便后期做安全规则
  show-sql: true #配置打印SQL
  sql-column-case: camel
  security:
    username: admin
    password: 123456
  #同一个应用部署了多套的情况下，可能出现接口不同步的问题。因在启动后接口信息全部缓存在内存中，新增也如此，所以对于其他机器是不知道有接口变动的，解决这个问题需要将变更信息同步到其他机器，所以有了这个集群插件。
  #默认情况下，集群插件依赖于redis插件，引入cluster插件后，将自动引入redis插件
  ##在不想依赖Redis的情况下，可以自行实现推送通知(MagicNotifyService和MagicAPIService.processNotify)
  instanceId: .... #实例ID，集群环境下，要保证每台机器不同。默认启动后随机生成uuid，如无特殊情况可不配置。
  cluster:
    channel:  ${spring.application.name}:notify:channel #redis 通道,此值为默认值, 需用应用区分
  # 可设置全局导入模块 # org.ssssssss.magicapi.spring.boot.starter.MagicAPIProperties#autoImportModule
  # 覆盖默认配置时候别忘了加上db (如果不需要可忽略)
#  auto-import-module: db,test
  resource: # 配置存储方式，默认使用的是文件
#    location: data/magic-api # 接口信息存放外部指定目录
    location: classpath:magic-api # 接口信息存放在 src/main/resources/magic-api 下，可以打包在Jar中
#  resource: # 配置存储方式，使用数据库
#    type: database # 配置存储在数据库中
#    tableName: magic_api_file # 数据库中的表名
#    prefix: /magic-api # key前缀
#    readonly: false # 是否是只读模式
#  resource:
#    type: redis# 配置存储在redis中
#    prefix: magic-api # key前缀
#    readonly: false # 是否是只读模式
  response-code:
    success: 200 #执行成功的code值
    invalid: 400 #参数验证未通过的code值
    exception: 500 #执行出现异常的code值
  response: |- # 可选配置。自定义JSON格式，格式为magic-script中的表达式
    {
      code: code,
      message: message,
      data,
      timestamp,
      requestTime,
      executeTime,
    }
  cache:
    enable: false  #开启缓存，默认是不开启的
    ttl: 86400000 #有效期1Day，默认-1 即永不过期
  page:
    page: current # 页码的请求参数名称 缺省时为page
    size: size # 页大小的请求参数名称 缺省时为size
    default-page: 1 # 自定义默认首页 缺省时为1
    default-size: 10 # 自定义为默认页大小 缺省时为10
  backup: #备份相关配置
    enable: true #是否启用
    max-history: -1 #备份保留天数，-1为永久保留
    table-name: magic_backup_record_v2 #使用数据库存储备份时的表名
#  crud: # CRUD相关配置
#    logic-delete-column: is_del #逻辑删除列
#    logic-delete-value: 1 #逻辑删除值

#  throw-exception: true # 执行出错时，magic-api自己实现全局异常统一处理，随后将抛出的异常处理交给spring处理
#  editor-config: classpath:./magic-editor-config.js #编辑器配置

  #在引入magic-api-plugin-task插件之后，重启项目，页面左侧就能看到对应的定时任务了，新建之后，填入cron表达式，名字，脚本信息即可。
#  task:
#      thread-name-prefix: magic-task- #线程池名字前缀
#      pool:
#        size: 8 #线程池大小，默认值为CPU核心数
#      shutdown:
#        awaitTermination: false #关闭时是否等待任务执行完毕，默认为false
#        awaitTerminationPeriod: 10s # 关闭时最多等待任务执行完毕的时间

# 鉴权框架,后面可能替换
# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: token
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

